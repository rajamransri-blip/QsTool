          """


          def storage_root():
              if platform == "android":
                  return Path("/storage/emulated/0/QsTool")
              return Path.home() / "QsTool"


          def make_dirs():
              try:
                  root = storage_root()
                  for folder in ("Original", "Editor", "Unpack", "Structure"):
                      (root / folder).mkdir(parents=True, exist_ok=True)
                  return root
              except Exception:
                  return Path.home()


          class HomeScreen(Screen):
              pass


          class UnpackScreen(Screen):
              pak_values = ListProperty([])
              status = StringProperty("Ready")
              terminal = StringProperty("")

              def on_enter(self):
                  make_dirs()
                  self.refresh()

              def log(self, message):
                  def update(_dt):
                      self.terminal += message + "\n"
                  Clock.schedule_once(update)

              def refresh(self):
                  root = storage_root()
                  original = root / "Original"

                  if not original.exists():
                      self.status = "Grant storage permission first"
                      return

                  try:
                      files = sorted(
                          p.name
                          for p in original.iterdir()
                          if p.is_file() and p.suffix.lower() == ".pak"
                      )
                      self.pak_values = files
                      self.ids.pak_spinner.values = files

                      if files:
                          self.ids.pak_spinner.text = files[0]
                          self.status = f"{len(files)} PAK files detected"
                      else:
                          self.ids.pak_spinner.text = "Choose PAK"
                          self.status = "No .pak in Original/ folder"
                  except Exception as e:
                      self.status = f"Read error: {str(e)}"

              def start_unpack(self):
                  pak_name = self.ids.pak_spinner.text.strip()
                  target = self.ids.target.text.strip()

                  if not pak_name or pak_name == "Choose PAK":
                      self.status = "Select a PAK file"
                      return

                  if not target:
                      self.status = "Target cannot be empty"
                      return

                  root = storage_root()
                  pak_path = root / "Original" / pak_name
                  self.terminal = ""
                  self.status = "Unpacking..."

                  csv_path = None
                  for cand in ("assets/BGMI.csv", str(root / "BGMI.csv")):
                      if os.path.exists(cand):
                          csv_path = cand
                          break

                  thread = threading.Thread(
                      target=self.worker,
                      args=(pak_path, root / "Unpack", root / "Structure", target, csv_path),
                      daemon=True,
                  )
                  thread.start()

              def worker(self, pak_path, unpack_dir, structure_dir, target, csv_path):
                  started = time.perf_counter()
                  try:
                      self.log(f"Opening: {pak_path.name}")
                      reader = PakReader(pak_path, csv_path=csv_path)
                      reader.open()

                      self.log(f"Version: {reader.version} | Entries: {len(reader.entries):,}")

                      target_norm = target.replace("\\", "/").strip("/").lower()
                      stem_target = Path(target_norm).stem.lower()

                      wanted = []
                      if target.upper() == "ALL":
                          wanted = list(reader.entries.values())
                      else:
                          for entry in reader.entries.values():
                              p_lower = entry.path.lower()
                              p_stem = Path(entry.path).stem.lower()
                              # Support .uasset + .uexp + .ubulk + .lua pair extraction
                              if (
                                  p_lower.endswith(target_norm)
                                  or Path(entry.path).name.lower() == target_norm
                                  or (stem_target == p_stem)
                              ):
                                  wanted.append(entry)

                      if not wanted:
                          self.log(f"Target not indexed. Deep stream carving for {target}...")
                          data = reader.extract_raw_asset(target)
                          if data:
                              out_file = unpack_dir / target
                              out_file.write_bytes(data)
                              self.log(f"Carved exact stream: {target} ({len(data):,} bytes)")
                              Clock.schedule_once(lambda dt: setattr(self, "status", "Completed (Carved)"))
                              return
                          else:
                              raise PakError(f"Target '{target}' not found in PAK.")

                      self.log(f"Extracting {len(wanted)} files (byte-by-byte)...")
                      total_bytes = 0

                      for idx, entry in enumerate(wanted, 1):
                          clean_subpath = entry.path.lstrip("/\\")
                          output = unpack_dir / clean_subpath
                          output.parent.mkdir(parents=True, exist_ok=True)

                          data = reader.read_entry(entry)
                          output.write_bytes(data)

                          total_bytes += len(data)
                          if idx % 20 == 0 or idx == len(wanted):
                              self.log(f"[{idx}/{len(wanted)}] {clean_subpath} ({len(data):,} B)")

                      report = structure_dir / f"{pak_path.stem}_structure.txt"
                      with report.open("w", encoding="utf-8") as fp:
                          for entry in reader.entries.values():
                              fp.write(f"{entry.path}\t{entry.uncompressed_size}\t{entry.compression}\n")

                      elapsed = time.perf_counter() - started
                      self.log(f"Finished: {total_bytes:,} bytes in {elapsed:.2f}s")
                      Clock.schedule_once(lambda dt: setattr(self, "status", "Completed!"))

                  except Exception as exc:
                      self.log(f"ERROR: {str(exc)}")
                      Clock.schedule_once(lambda dt: setattr(self, "status", "Failed - Check Logs"))


          class SettingsScreen(Screen):
              bot_token = StringProperty("")
              chat_id = StringProperty("")
              bot_status = StringProperty("Bot: Inactive")
              is_polling = BooleanProperty(False)

              def on_enter(self):
                  self.load_config()

              def get_config_path(self):
                  return storage_root() / "bot_config.json"

              def load_config(self):
                  cfg = self.get_config_path()
                  if cfg.exists():
                      try:
                          data = json.loads(cfg.read_text(encoding="utf-8"))
                          self.bot_token = data.get("bot_token", "")
                          self.chat_id = data.get("chat_id", "")
                          self.ids.token_input.text = self.bot_token
                          self.ids.chat_id_input.text = self.chat_id
                      except Exception:
                          pass

              def save_config(self):
                  self.bot_token = self.ids.token_input.text.strip()
                  self.chat_id = self.ids.chat_id_input.text.strip()
                  cfg = self.get_config_path()
                  try:
                      cfg.write_text(
                          json.dumps({"bot_token": self.bot_token, "chat_id": self.chat_id}),
                          encoding="utf-8"
                      )
                      self.bot_status = "Configuration saved successfully."
                  except Exception as e:
                      self.bot_status = f"Error saving: {e}"

              def toggle_polling(self):
                  app = App.get_running_app()
                  if self.is_polling:
                      app.stop_telegram_bot()
                      self.is_polling = False
                      self.bot_status = "Polling stopped."
                  else:
                      self.save_config()
                      if not self.bot_token:
                          self.bot_status = "Token cannot be empty."
                          return
                      app.start_telegram_bot(self.bot_token, self.chat_id)
                      self.is_polling = True
                      self.bot_status = "Polling active..."


          class QsToolApp(App):
              def __init__(self, **kwargs):
                  super().__init__(**kwargs)
                  self.bot_running = False
                  self.bot_thread = None

              def build(self):
                  Builder.load_string(KV)
                  sm = ScreenManager()
                  sm.add_widget(HomeScreen(name="home"))
                  sm.add_widget(UnpackScreen(name="unpack"))
                  sm.add_widget(SettingsScreen(name="settings"))
                  Clock.schedule_once(lambda dt: self.init_app(), 0.3)
                  return sm

              def init_app(self):
                  self.check_and_request_permissions()
                  make_dirs()

              def check_and_request_permissions(self):
                  if platform != "android":
                      return
                  try:
                      from jnius import autoclass
                      Environment = autoclass("android.os.Environment")
                      if not Environment.isExternalStorageManager():
                          Intent = autoclass("android.content.Intent")
                          Settings = autoclass("android.provider.Settings")
                          Uri = autoclass("android.net.Uri")
                          PythonActivity = autoclass("org.kivy.android.PythonActivity")
                          current_activity = PythonActivity.mActivity
                          intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                          uri = Uri.parse(f"package:{current_activity.getPackageName()}")
                          intent.setData(uri)
                          current_activity.startActivity(intent)
                  except Exception:
                      pass

              def start_telegram_bot(self, token, auth_chat_id):
                  self.bot_running = True
                  self.bot_thread = threading.Thread(
                      target=self._telegram_worker,
                      args=(token, auth_chat_id),
                      daemon=True
                  )
                  self.bot_thread.start()

              def stop_telegram_bot(self):
                  self.bot_running = False

              def _telegram_worker(self, token, auth_chat_id):
                  offset = 0
                  base_url = f"https://api.telegram.org/bot{token}/"

                  def send_msg(chat_id, text):
                      try:
                          url = base_url + "sendMessage"
                          payload = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
                          urllib.request.urlopen(url, data=payload, timeout=10)
                      except Exception:
                          pass

                  while self.bot_running:
                      try:
                          req_url = f"{base_url}getUpdates?offset={offset}&timeout=15"
                          with urllib.request.urlopen(req_url, timeout=20) as resp:
                              res = json.loads(resp.read().decode())

                          if res.get("ok"):
                              for item in res.get("result", []):
                                  offset = item["update_id"] + 1
                                  msg = item.get("message", {})
                                  text = msg.get("text", "").strip()
                                  sender_id = str(msg.get("chat", {}).get("id", ""))

                                  if auth_chat_id and sender_id != auth_chat_id:
                                      continue

                                  if text == "/start" or text == "/help":
                                      reply = (
                                          "QsTool Remote Controller:\n"
                                          "/status - View storage and engine status\n"
                                          "/list - List detected PAK files\n"
                                          "/unpack <pak> <target> - Trigger extraction\n"
                                      )
                                      send_msg(sender_id, reply)

                                  elif text == "/status":
                                      root = storage_root()
                                      send_msg(sender_id, f"QsTool Active on Device\nRoot: {root}")

                                  elif text == "/list":
                                      root = storage_root()
                                      paks = [p.name for p in (root / "Original").glob("*.pak")]
                                      msg_text = "PAKs:\n" + "\n".join(paks) if paks else "No PAKs in Original/"
                                      send_msg(sender_id, msg_text)

                                  elif text.startswith("/unpack"):
                                      parts = text.split(maxsplit=2)
                                      if len(parts) >= 3:
                                          pak_name, tgt = parts[1], parts[2]
                                          send_msg(sender_id, f"Unpacking {tgt} from {pak_name}...")
                                          root = storage_root()
                                          reader = PakReader(root / "Original" / pak_name)
                                          reader.open()
                                          carved = reader.extract_raw_asset(tgt)
                                          if carved:
                                              (root / "Unpack" / tgt).write_bytes(carved)
                                              send_msg(sender_id, f"Success: Extracted {tgt} ({len(carved):,} B)")
                                          else:
                                              send_msg(sender_id, f"Failed: {tgt} not located.")
                                      else:
                                          send_msg(sender_id, "Usage: /unpack <pak_name> <target_filename>")

                      except Exception:
                          time.sleep(3)


          if __name__ == "__main__":
              QsToolApp().run()
          PY

      - name: Generate buildozer.spec
        shell: bash
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = QsTool
          package.name = qstool
          package.domain = org.qstool

          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,csv,txt,json
          source.include_patterns = assets/*,qstool/*
          source.exclude_dirs = .git,.buildozer,bin,build,dist,__pycache__

          version = 1.0.0
          requirements = python3==3.11.9,kivy==2.3.0

          orientation = portrait
          fullscreen = 0

          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.archs = arm64-v8a

          android.accept_sdk_license = True
          android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE,INTERNET

          p4a.bootstrap = sdl2
          p4a.branch = v2024.01.21

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build Android APK
        shell: bash
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QsTool-Fixed-Release-APK
          path: bin/*.apk
          if-no-files-found: error
