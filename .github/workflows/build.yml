name: QsTool - Generate Project and Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

env:
  APP_NAME: QsTool
  PACKAGE_NAME: qstool
  PACKAGE_DOMAIN: org.qstool
  PYTHON_VERSION: "3.12"
  ANDROID_API: "35"
  ANDROID_MINAPI: "24"
  ANDROID_NDK: "28c"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Clean old generated project files
      # ------------------------------------------------------------
      - name: Clean old project
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning old generated files..."

          rm -rf bin
          rm -rf .buildozer
          rm -rf build
          rm -rf dist
          rm -rf qstool
          rm -rf __pycache__

          rm -f main.py
          rm -f buildozer.spec
          rm -f requirements.txt

          mkdir -p assets
          mkdir -p qstool

      # ------------------------------------------------------------
      # 3. Verify BGMI.csv
      # ------------------------------------------------------------
      - name: Verify BGMI.csv
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f assets/BGMI.csv ]; then
            echo "::error::assets/BGMI.csv not found."
            echo "Upload BGMI.csv to the repository at assets/BGMI.csv."
            exit 1
          fi

          echo "BGMI.csv found:"
          ls -lh assets/BGMI.csv

      # ------------------------------------------------------------
      # 4. Generate main.py
      # ------------------------------------------------------------
      - name: Generate Python application
        shell: bash
        run: |
          cat > main.py <<'PY'
          __version__ = "1.0.0"

          import csv
          import threading
          import time
          from pathlib import Path

          from kivy.app import App
          from kivy.clock import Clock
          from kivy.lang import Builder
          from kivy.properties import StringProperty
          from kivy.uix.screenmanager import ScreenManager, Screen

          from qstool.pak import PakReader, PakError


          KV = r'''
          ScreenManager:
              HomeScreen:
              UnpackScreen:

          <HomeScreen>:
              name: "home"

              BoxLayout:
                  orientation: "vertical"
                  padding: dp(18)
                  spacing: dp(12)

                  Label:
                      text: "QsTool"
                      font_size: "30sp"
                      bold: True
                      size_hint_y: None
                      height: dp(55)

                  Label:
                      text: "PAK Unpack / Structure Tool"
                      size_hint_y: None
                      height: dp(35)

                  Button:
                      text: "Unpack"
                      size_hint_y: None
                      height: dp(55)
                      on_release:
                          root.manager.current = "unpack"

                  Label:
                      text: "Storage: /storage/emulated/0/QsTool/"
                      size_hint_y: None
                      height: dp(40)

          <UnpackScreen>:
              name: "unpack"

              BoxLayout:
                  orientation: "vertical"
                  padding: dp(12)
                  spacing: dp(8)

                  Label:
                      text: "PAK Unpack"
                      font_size: "24sp"
                      bold: True
                      size_hint_y: None
                      height: dp(42)

                  Spinner:
                      id: pak_spinner
                      text: "Choose PAK"
                      values: root.pak_values
                      size_hint_y: None
                      height: dp(48)

                  Button:
                      text: "Detect / Refresh PAK"
                      size_hint_y: None
                      height: dp(44)
                      on_release:
                          root.refresh()

                  TextInput:
                      id: target
                      hint_text: "Target file name or ALL"
                      multiline: False
                      size_hint_y: None
                      height: dp(48)

                  Button:
                      text: "Unpacking Options"
                      size_hint_y: None
                      height: dp(52)
                      on_release:
                          root.start_unpack()

                  Label:
                      text: root.status
                      text_size: self.width, None
                      halign: "left"
                      valign: "top"

                  TextInput:
                      text: root.terminal
                      readonly: True
                      size_hint_y: 1

                  Button:
                      text: "Back"
                      size_hint_y: None
                      height: dp(44)
                      on_release:
                          root.manager.current = "home"
          '''


          def storage_root():
              android_storage = Path("/storage/emulated/0")

              if android_storage.exists():
                  return android_storage / "QsTool"

              return Path.home() / "QsTool"


          def ensure_dirs():
              root = storage_root()

              for name in (
                  "Original",
                  "Editor",
                  "Unpack",
                  "Structure",
              ):
                  (root / name).mkdir(
                      parents=True,
                      exist_ok=True
                  )

              return root


          class HomeScreen(Screen):
              pass


          class UnpackScreen(Screen):

              pak_values = []
              status = StringProperty("")
              terminal = StringProperty("")

              def on_pre_enter(self):
                  ensure_dirs()
                  self.refresh()

              def log(self, text):
                  def update(_dt):
                      self.terminal += text + "\n"

                  Clock.schedule_once(update)

              def refresh(self):
                  root = ensure_dirs()

                  original = root / "Original"

                  files = sorted(
                      [
                          p.name
                          for p in original.iterdir()
                          if p.is_file()
                          and p.suffix.lower() == ".pak"
                      ]
                  )

                  self.pak_values = files
                  self.ids.pak_spinner.values = files

                  if files:
                      self.ids.pak_spinner.text = files[0]
                      self.status = (
                          f"Detected {len(files)} PAK file(s)"
                      )
                  else:
                      self.ids.pak_spinner.text = "Choose PAK"
                      self.status = (
                          "Put .pak files into:\n"
                          f"{original}"
                      )

              def start_unpack(self):
                  pak_name = self.ids.pak_spinner.text.strip()
                  target = self.ids.target.text.strip()

                  if (
                      not pak_name
                      or pak_name == "Choose PAK"
                  ):
                      self.status = "Choose a PAK first."
                      return

                  if not target:
                      self.status = (
                          "Enter target filename or ALL."
                      )
                      return

                  root = ensure_dirs()

                  pak_path = (
                      root
                      / "Original"
                      / pak_name
                  )

                  unpack_dir = root / "Unpack"
                  structure_dir = root / "Structure"

                  self.terminal = ""
                  self.status = "Starting..."

                  threading.Thread(
                      target=self.worker,
                      args=(
                          pak_path,
                          unpack_dir,
                          structure_dir,
                          target,
                      ),
                      daemon=True,
                  ).start()

              def worker(
                  self,
                  pak_path,
                  unpack_dir,
                  structure_dir,
                  target,
              ):
                  started = time.perf_counter()

                  try:
                      self.log(
                          f"PAK: {pak_path.name}"
                      )

                      self.log(
                          f"Target: {target}"
                      )

                      self.log(
                          "Reading PAK index..."
                      )

                      reader = PakReader(
                          pak_path
                      )

                      reader.open()

                      self.log(
                          f"Version: {reader.version}"
                      )

                      self.log(
                          f"Entries: {len(reader.entries):,}"
                      )

                      self.log(
                          f"Encrypted index: "
                          f"{reader.encrypted_index}"
                      )

                      if reader.encrypted_index:
                          raise PakError(
                              "Encrypted PAK index. "
                              "An authorized key is required."
                          )

                      wanted = []

                      target_norm = (
                          target
                          .replace("\\", "/")
                          .strip("/")
                          .lower()
                      )

                      if target.upper() == "ALL":
                          wanted = list(
                              reader.entries.values()
                          )

                      else:
                          for entry in (
                              reader.entries.values()
                          ):
                              filename = (
                                  Path(entry.path)
                                  .name
                                  .lower()
                              )

                              if filename == target_norm:
                                  wanted.append(entry)

                          if not wanted:
                              for entry in (
                                  reader.entries.values()
                              ):
                                  if (
                                      entry.path.lower()
                                      == target_norm
                                  ):
                                      wanted.append(entry)

                      if not wanted:
                          raise PakError(
                              "Target file not found "
                              "in PAK index."
                          )

                      self.log(
                          f"Matched: {len(wanted):,}"
                      )

                      total_bytes = 0

                      for index, entry in enumerate(
                          wanted,
                          start=1,
                      ):
                          output = (
                              unpack_dir
                              / Path(entry.path)
                          )

                          output.parent.mkdir(
                              parents=True,
                              exist_ok=True,
                          )

                          one_started = (
                              time.perf_counter()
                          )

                          data = (
                              reader.read_entry(entry)
                          )

                          output.write_bytes(data)

                          size = len(data)

                          total_bytes += size

                          elapsed = (
                              time.perf_counter()
                              - one_started
                          )

                          self.log(
                              f"[{index}/"
                              f"{len(wanted)}] "
                              f"{entry.path} | "
                              f"{size:,} bytes | "
                              f"{elapsed:.2f}s"
                          )

                      report = (
                          structure_dir
                          / f"{pak_path.stem}"
                          "_structure.txt"
                      )

                      with report.open(
                          "w",
                          encoding="utf-8",
                      ) as fp:

                          for entry in (
                              reader.entries.values()
                          ):
                              fp.write(
                                  f"{entry.path}\t"
                                  f"{entry.uncompressed_size}\t"
                                  f"{entry.compression}\n"
                              )

                      total_time = (
                          time.perf_counter()
                          - started
                      )

                      self.log(
                          f"Total: "
                          f"{total_bytes:,} bytes"
                      )

                      self.log(
                          f"Time: "
                          f"{total_time:.2f}s"
                      )

                      Clock.schedule_once(
                          lambda dt: setattr(
                              self,
                              "status",
                              "Unpacking completed.",
                          )
                      )

                  except Exception as exc:
                      self.log(
                          "ERROR: "
                          + str(exc)
                      )

                      Clock.schedule_once(
                          lambda dt: setattr(
                              self,
                              "status",
                              "Unpacking failed. "
                              "See terminal.",
                          )
                      )


          class QsToolApp(App):

              def build(self):
                  ensure_dirs()

                  Builder.load_string(KV)

                  return ScreenManager()


          if __name__ == "__main__":
              QsToolApp().run()
          PY

      # ------------------------------------------------------------
      # 5. Generate PAK reader
      # ------------------------------------------------------------
      - name: Generate PAK engine
        shell: bash
        run: |
          cat > qstool/__init__.py <<'PY'
          PY

          cat > qstool/pak.py <<'PY'
          import hashlib
          import io
          import struct
          import zlib

          from dataclasses import dataclass
          from pathlib import Path


          MAGIC = 0x5A6F12E1


          class PakError(Exception):
              pass


          @dataclass
          class Entry:
              path: str
              offset: int
              compressed_size: int
              uncompressed_size: int
              sha1: bytes
              compression: str
              blocks: list


          class Reader:

              def __init__(self, fp):
                  self.fp = fp

              def raw(self, size):
                  data = self.fp.read(size)

                  if len(data) != size:
                      raise PakError(
                          "Unexpected EOF."
                      )

                  return data

              def i32(self):
                  return struct.unpack(
                      "<i",
                      self.raw(4),
                  )[0]

              def u32(self):
                  return struct.unpack(
                      "<I",
                      self.raw(4),
                  )[0]

              def i64(self):
                  return struct.unpack(
                      "<q",
                      self.raw(8),
                  )[0]

              def fstring(self):
                  size = self.i32()

                  if size == 0:
                      return ""

                  if size < 0:
                      count = -size

                      data = self.raw(
                          count * 2
                      )

                      return data[:-2].decode(
                          "utf-16le",
                          errors="replace",
                      )

                  data = self.raw(size)

                  return data[:-1].decode(
                      "utf-8",
                      errors="replace",
                  )


          class PakReader:

              def __init__(self, path):
                  self.path = Path(path)
                  self.version = None
                  self.index_offset = None
                  self.index_size = None
                  self.encrypted_index = False
                  self.entries = {}

              def open(self):
                  size = (
                      self.path.stat().st_size
                  )

                  if size < 64:
                      raise PakError(
                          "File is too small."
                      )

                  with self.path.open(
                      "rb"
                  ) as fp:

                      tail_size = min(
                          size,
                          4096,
                      )

                      fp.seek(
                          size - tail_size
                      )

                      tail = fp.read(
                          tail_size
                      )

                      marker = struct.pack(
                          "<I",
                          MAGIC,
                      )

                      position = tail.rfind(
                          marker
                      )

                      if position < 0:
                          raise PakError(
                              "Unreal PAK magic "
                              "not found."
                          )

                      footer = (
                          size
                          - tail_size
                          + position
                      )

                      fp.seek(footer)

                      magic = struct.unpack(
                          "<I",
                          fp.read(4),
                      )[0]

                      if magic != MAGIC:
                          raise PakError(
                              "Invalid PAK magic."
                          )

                      self.version = struct.unpack(
                          "<I",
                          fp.read(4),
                      )[0]

                      self.index_offset = (
                          struct.unpack(
                              "<q",
                              fp.read(8),
                          )[0]
                      )

                      self.index_size = (
                          struct.unpack(
                              "<q",
                              fp.read(8),
                          )[0]
                      )

                      index_hash = fp.read(
                          20
                      )

                      if len(index_hash) != 20:
                          raise PakError(
                              "Invalid footer."
                          )

                      flag = fp.read(1)

                      self.encrypted_index = (
                          bool(
                              flag
                              and flag[0] != 0
                          )
                      )

                      if (
                          self.index_offset < 0
                          or self.index_size <= 0
                      ):
                          raise PakError(
                              "Invalid index."
                          )

                      if (
                          self.index_offset
                          + self.index_size
                          > size
                      ):
                          raise PakError(
                              "Index outside PAK."
                          )

                      if self.encrypted_index:
                          return self

                      fp.seek(
                          self.index_offset
                      )

                      index_data = fp.read(
                          self.index_size
                      )

                  self.parse_index(
                      index_data
                  )

                  return self

              def parse_index(
                  self,
                  data,
              ):
                  reader = Reader(
                      io.BytesIO(data)
                  )

                  mount = reader.fstring()

                  count = reader.i32()

                  if (
                      count < 0
                      or count > 50_000_000
                  ):
                      raise PakError(
                          "Invalid entry count."
                      )

                  for _ in range(count):

                      relative = (
                          reader.fstring()
                          .replace("\\", "/")
                          .lstrip("/")
                      )

                      path = (
                          mount + relative
                      ).replace(
                          "\\",
                          "/",
                      )

                      offset = reader.i64()
                      uncompressed = reader.i64()
                      compressed = reader.i64()

                      sha1 = reader.raw(
                          20
                      )

                      block_count = (
                          reader.i32()
                      )

                      if (
                          block_count < 0
                          or block_count > 1_000_000
                      ):
                          raise PakError(
                              "Invalid block count."
                          )

                      blocks = []

                      for _block in range(
                          block_count
                      ):
                          start = reader.i64()
                          end = reader.i64()

                          blocks.append(
                              (
                                  start,
                                  end,
                              )
                          )

                      compression_index = (
                          reader.u32()
                      )

                      compression = {
                          0: "none",
                          1: "zlib",
                          2: "gzip",
                          3: "zstd",
                      }.get(
                          compression_index,
                          f"method-{compression_index}",
                      )

                      self.entries[path] = Entry(
                          path=path,
                          offset=offset,
                          compressed_size=compressed,
                          uncompressed_size=uncompressed,
                          sha1=sha1,
                          compression=compression,
                          blocks=blocks,
                      )

              def read_entry(
                  self,
                  entry,
              ):
                  with self.path.open(
                      "rb"
                  ) as fp:

                      if entry.blocks:
                          chunks = []

                          for start, end in (
                              entry.blocks
                          ):
                              if end < start:
                                  raise PakError(
                                      "Invalid block."
                                  )

                              fp.seek(start)

                              chunks.append(
                                  fp.read(
                                      end - start
                                  )
                              )

                          raw = b"".join(
                              chunks
                          )

                      else:
                          fp.seek(
                              entry.offset
                          )

                          raw = fp.read(
                              entry.compressed_size
                          )

                  if (
                      entry.compression
                      == "none"
                  ):
                      output = raw

                  elif (
                      entry.compression
                      == "zlib"
                  ):
                      try:
                          output = zlib.decompress(
                              raw
                          )
                      except zlib.error as exc:
                          raise PakError(
                              f"Zlib error: {exc}"
                          )

                  elif (
                      entry.compression
                      == "gzip"
                  ):
                      try:
                          output = zlib.decompress(
                              raw,
                              16
                              + zlib.MAX_WBITS,
                          )
                      except zlib.error as exc:
                          raise PakError(
                              f"Gzip error: {exc}"
                          )

                  elif (
                      entry.compression
                      == "zstd"
                  ):
                      try:
                          import zstandard
                      except ImportError:
                          raise PakError(
                              "Zstandard module is "
                              "not available in APK."
                          )

                      output = (
                          zstandard
                          .ZstdDecompressor()
                          .decompress(raw)
                      )

                  else:
                      raise PakError(
                          "Unsupported compression: "
                          + entry.compression
                      )

                  if (
                      len(output)
                      != entry.uncompressed_size
                  ):
                      raise PakError(
                          "Uncompressed size mismatch."
                      )

                  digest = hashlib.sha1(
                      output
                  ).digest()

                  if (
                      entry.sha1
                      and digest != entry.sha1
                  ):
                      raise PakError(
                          "SHA1 verification failed."
                      )

                  return output
          PY

      # ------------------------------------------------------------
      # 6. Requirements
      # ------------------------------------------------------------
      - name: Generate requirements
        shell: bash
        run: |
          cat > requirements.txt <<'EOF'
          kivy
          EOF

      # ------------------------------------------------------------
      # 7. Buildozer specification
      # ------------------------------------------------------------
      - name: Generate buildozer.spec
        shell: bash
        run: |
          cat > buildozer.spec <<'EOF'
          [app]

          title = QsTool
          package.name = qstool
          package.domain = org.qstool

          source.dir = .

          source.include_exts = py,csv,kv,txt,md

          source.include_patterns = assets/*,qstool/*

          source.exclude_dirs = bin,.buildozer,__pycache__,.git

          version = 1.0.0

          requirements = python3,kivy

          orientation = portrait

          fullscreen = 0

          android.api = 35
          android.minapi = 24
          android.ndk = 28c

          android.archs = arm64-v8a

          android.accept_sdk_license = True

          android.permissions = READ_MEDIA_IMAGES,READ_MEDIA_VIDEO,READ_MEDIA_AUDIO

          android.allow_backup = False

          android.release_artifact = apk

          p4a.bootstrap = sdl2

          [buildozer]

          log_level = 2
          warn_on_root = 0
          EOF

      # ------------------------------------------------------------
      # 8. Python setup
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ------------------------------------------------------------
      # 9. Ubuntu build dependencies
      # ------------------------------------------------------------
      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

          java -version
          python --version

      # ------------------------------------------------------------
      # 10. Build tools
      # ------------------------------------------------------------
      - name: Install Buildozer and Cython
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "cython==0.29.34"

          python -m pip install \
            "buildozer"

          buildozer --version

      # ------------------------------------------------------------
      # 11. Generate source manifest
      # ------------------------------------------------------------
      - name: Show generated source
        shell: bash
        run: |
          echo "========== PROJECT =========="
          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo "========== CSV =========="
          wc -l assets/BGMI.csv
          ls -lh assets/BGMI.csv

      # ------------------------------------------------------------
      # 12. Commit generated project back to repository
      # ------------------------------------------------------------
      - name: Commit generated project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            main.py \
            qstool \
            assets/BGMI.csv \
            buildozer.spec \
            requirements.txt

          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit \
              -m "Generate QsTool Python Android project"

            git push
          fi

      # ------------------------------------------------------------
      # 13. Build APK
      # ------------------------------------------------------------
      - name: Build release APK
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail

          yes | buildozer android clean || true

          buildozer -v android release

      # ------------------------------------------------------------
      # 14. Show APK
      # ------------------------------------------------------------
      - name: List APK
        shell: bash
        run: |
          echo "========== APK =========="

          find bin \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print \
            -exec ls -lh {} \;

      # ------------------------------------------------------------
      # 15. Upload APK artifact
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QsTool-APK
          path: |
            bin/*.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # 16. Upload build logs if build fails
      # ------------------------------------------------------------
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QsTool-build-debug
          path: |
            .buildozer/
            bin/
          if-no-files-found: ignore