name: QsTool Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip pkg-config autoconf automake \
            libtool zlib1g-dev libffi-dev libssl-dev cmake

          pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.36" "buildozer==1.5.0"

      - name: Clean and Setup Directories
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .buildozer bin build dist qstool
          mkdir -p assets qstool

          if [ ! -f assets/BGMI.csv ]; then
            echo "filename,path" > assets/BGMI.csv
            echo "BP_PlayerPawn.uasset,ShadowTrackerExtra/Content/Pawn/BP_PlayerPawn.uasset" >> assets/BGMI.csv
            echo "BP_PlayerPawn.uexp,ShadowTrackerExtra/Content/Pawn/BP_PlayerPawn.uexp" >> assets/BGMI.csv
          fi

      - name: Generate Universal PAK Engine (qstool/pak.py)
        shell: bash
        run: |
          cat > qstool/__init__.py <<'PY'
          PY

          cat > qstool/pak.py <<'PY'
          import csv
          import io
          import os
          import struct
          import zlib
          from dataclasses import dataclass
          from pathlib import Path

          MAGIC = 0x5A6F12E1
          UASSET_MAGIC = 0x9E2A83C1
          LUA_MAGIC = b"\x1bLua"
          LUAJIT_MAGIC = b"\x1bLJ"


          class PakError(Exception):
              pass


          @dataclass
          class Entry:
              path: str
              offset: int
              compressed_size: int
              uncompressed_size: int
              sha1: bytes
              compression: str
              blocks: list


          class Reader:
              def __init__(self, fp):
                  self.fp = fp

              def raw(self, n):
                  data = self.fp.read(n)
                  if len(data) != n:
                      raise PakError("Unexpected EOF while reading PAK")
                  return data

              def i32(self):
                  return struct.unpack("<i", self.raw(4))[0]

              def u32(self):
                  return struct.unpack("<I", self.raw(4))[0]

              def i64(self):
                  return struct.unpack("<q", self.raw(8))[0]

              def fstring(self):
                  size = self.i32()
                  if size == 0:
                      return ""
                  if size < 0:
                      count = -size
                      data = self.raw(count * 2)
                      return data[:-2].decode("utf-16le", errors="replace")
                  data = self.raw(size)
                  return data[:-1].decode("utf-8", errors="replace")


          class PakReader:
              def __init__(self, path, csv_path=None):
                  self.path = Path(path)
                  self.csv_path = csv_path
                  self.version = 0
                  self.index_offset = 0
                  self.index_size = 0
                  self.encrypted_index = False
                  self.entries = {}
                  self.csv_map = {}

                  if self.csv_path and os.path.exists(self.csv_path):
                      self.load_csv()

              def load_csv(self):
                  try:
                      with open(self.csv_path, "r", encoding="utf-8", errors="ignore") as f:
                          reader = csv.reader(f)
                          for row in reader:
                              if len(row) >= 2:
                                  self.csv_map[row[0].strip().lower()] = row[1].strip()
                  except Exception:
                      pass

              def open(self):
                  file_size = self.path.stat().st_size
                  if file_size < 64:
                      raise PakError("Invalid file size")

                  with self.path.open("rb") as fp:
                      # 1. Search Standard Footer (Last 256KB)
                      scan_size = min(file_size, 262144)
                      fp.seek(file_size - scan_size)
                      tail = fp.read(scan_size)
                      marker = struct.pack("<I", MAGIC)
                      pos = tail.rfind(marker)

                      found = False
                      if pos >= 0:
                          fp.seek(file_size - scan_size + pos)
                          struct.unpack("<I", fp.read(4))
                          self.version = struct.unpack("<I", fp.read(4))[0]
                          self.index_offset = struct.unpack("<q", fp.read(8))[0]
                          self.index_size = struct.unpack("<q", fp.read(8))[0]
                          fp.read(20)
                          flag = fp.read(1)
                          self.encrypted_index = bool(flag and flag[0] != 0)
                          if 0 < self.index_size <= file_size and 0 <= self.index_offset <= file_size:
                              found = True

                      # 2. Search Container Header (First 64KB)
                      if not found:
                          fp.seek(0)
                          head = fp.read(min(file_size, 65536))
                          pos_h = head.find(marker)
                          if pos_h >= 0:
                              fp.seek(pos_h)
                              struct.unpack("<I", fp.read(4))
                              self.version = struct.unpack("<I", fp.read(4))[0]
                              self.index_offset = struct.unpack("<q", fp.read(8))[0]
                              self.index_size = struct.unpack("<q", fp.read(8))[0]
                              fp.read(20)
                              flag = fp.read(1)
                              self.encrypted_index = bool(flag and flag[0] != 0)
                              found = True

                      if not found or self.encrypted_index or self.index_size <= 0:
                          # Container mode fallback
                          self.entries["RAW_SCAN"] = Entry(
                              path="RAW_CONTAINER",
                              offset=0,
                              compressed_size=file_size,
                              uncompressed_size=file_size,
                              sha1=b"",
                              compression="raw",
                              blocks=[]
                          )
                          return self

                      if self.index_offset + self.index_size > file_size:
                          fp.seek(max(0, file_size - self.index_size))
                      else:
                          fp.seek(self.index_offset)

                      data = fp.read(self.index_size)

                  self.parse_index(data)
                  return self

              def parse_index(self, data):
                  reader = Reader(io.BytesIO(data))
                  try:
                      mount = reader.fstring()
                      count = reader.i32()
                  except Exception:
                      return

                  if count < 0 or count > 5_000_000:
                      return

                  for _ in range(count):
                      relative = reader.fstring().replace("\\", "/").lstrip("/")
                      path = (mount + relative).replace("\\", "/")
                      offset = reader.i64()
                      uncompressed = reader.i64()
                      compressed = reader.i64()
                      sha1 = reader.raw(20)

                      blocks = []
                      block_count = reader.i32()
                      if block_count < 0 or block_count > 100_000:
                          break

                      for _b in range(block_count):
                          blocks.append((reader.i64(), reader.i64()))

                      compression_id = reader.u32()
                      compression = {0: "none", 1: "zlib", 2: "gzip", 3: "zstd"}.get(
                          compression_id, "unknown"
                      )

                      self.entries[path] = Entry(
                          path=path,
                          offset=offset,
                          compressed_size=compressed,
                          uncompressed_size=uncompressed,
                          sha1=sha1,
                          compression=compression,
                          blocks=blocks,
                      )

              def extract_raw_asset(self, target_name):
                  """Deep byte-for-byte stream carver with exact magic headers"""
                  stem = Path(target_name).stem.encode("utf-8")
                  ext = Path(target_name).suffix.lower()

                  with self.path.open("rb") as fp:
                      blob = fp.read()

                  idx = blob.find(stem)
                  if idx == -1:
                      return None

                  # UAsset parsing
                  if ext == ".uasset":
                      uasset_tag = struct.pack("<I", UASSET_MAGIC)
                      tag_idx = blob.rfind(uasset_tag, 0, idx)
                      if tag_idx != -1:
                          return blob[tag_idx:idx + 1048576]

                  # Lua binary bytecode
                  if ext in (".lua", ".luac"):
                      l_idx = blob.find(LUA_MAGIC)
                      if l_idx != -1:
                          return blob[l_idx:l_idx + 524288]
                      lj_idx = blob.find(LUAJIT_MAGIC)
                      if lj_idx != -1:
                          return blob[lj_idx:lj_idx + 524288]

                  start = max(0, idx - 64)
                  return blob[start:idx + 524288]

              def read_entry(self, entry):
                  if entry.compression == "raw":
                      return self.extract_raw_asset("BP_PlayerPawn.uasset")

                  with self.path.open("rb") as fp:
                      if entry.blocks:
                          chunks = []
                          for start, end in entry.blocks:
                              fp.seek(start)
                              chunks.append(fp.read(end - start))
                          raw = b"".join(chunks)
                      else:
                          fp.seek(entry.offset)
                          raw = fp.read(entry.compressed_size)

                  if entry.compression == "none":
                      output = raw
                  elif entry.compression == "zlib":
                      try:
                          output = zlib.decompress(raw)
                      except zlib.error:
                          output = zlib.decompress(raw, -zlib.MAX_WBITS)
                  elif entry.compression == "gzip":
                      output = zlib.decompress(raw, 16 + zlib.MAX_WBITS)
                  else:
                      output = raw

                  return output
          PY

