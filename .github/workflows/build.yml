name: QsTool Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Official Kivy Docker container with pre-installed SDK, NDK, and toolchains
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Workspace and Scripts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets qstool

          if [ ! -f assets/BGMI.csv ]; then
            echo "filename,size,type" > assets/BGMI.csv
          fi

      - name: Generate pak.py Engine
        shell: bash
        run: |
          cat > qstool/__init__.py <<'PY'
          PY

          cat > qstool/pak.py <<'PY'
          import hashlib
          import io
          import struct
          import zlib
          from dataclasses import dataclass
          from pathlib import Path

          MAGIC = 0x5A6F12E1


          class PakError(Exception):
              pass


          @dataclass
          class Entry:
              path: str
              offset: int
              compressed_size: int
              uncompressed_size: int
              sha1: bytes
              compression: str
              blocks: list


          class Reader:
              def __init__(self, fp):
                  self.fp = fp

              def raw(self, n):
                  data = self.fp.read(n)
                  if len(data) != n:
                      raise PakError("Unexpected EOF while reading PAK")
                  return data

              def i32(self):
                  return struct.unpack("<i", self.raw(4))[0]

              def u32(self):
                  return struct.unpack("<I", self.raw(4))[0]

              def i64(self):
                  return struct.unpack("<q", self.raw(8))[0]

              def fstring(self):
                  size = self.i32()
                  if size == 0:
                      return ""
                  if size < 0:
                      count = -size
                      data = self.raw(count * 2)
                      return data[:-2].decode("utf-16le", errors="replace")
                  data = self.raw(size)
                  return data[:-1].decode("utf-8", errors="replace")


          class PakReader:
              def __init__(self, path):
                  self.path = Path(path)
                  self.version = None
                  self.index_offset = None
                  self.index_size = None
                  self.encrypted_index = False
                  self.entries = {}

              def open(self):
                  file_size = self.path.stat().st_size
                  if file_size < 64:
                      raise PakError("File too small to be a valid PAK")

                  with self.path.open("rb") as fp:
                      tail_size = min(file_size, 4096)
                      fp.seek(file_size - tail_size)
                      tail = fp.read(tail_size)
                      marker = struct.pack("<I", MAGIC)
                      pos = tail.rfind(marker)

                      if pos < 0:
                          raise PakError("PAK magic not found in footer")

                      footer = file_size - tail_size + pos
                      fp.seek(footer)

                      magic = struct.unpack("<I", fp.read(4))[0]
                      if magic != MAGIC:
                          raise PakError("Invalid PAK magic header")

                      self.version = struct.unpack("<I", fp.read(4))[0]
                      self.index_offset = struct.unpack("<q", fp.read(8))[0]
                      self.index_size = struct.unpack("<q", fp.read(8))[0]
                      index_hash = fp.read(20)

                      if len(index_hash) != 20:
                          raise PakError("Corrupted PAK footer")

                      flag = fp.read(1)
                      self.encrypted_index = bool(flag and flag[0] != 0)
                      if self.encrypted_index:
                          return self

                      if self.index_offset < 0 or self.index_size <= 0:
                          raise PakError("Corrupted index boundary")

                      if self.index_offset + self.index_size > file_size:
                          raise PakError("PAK index outside file boundaries")

                      fp.seek(self.index_offset)
                      data = fp.read(self.index_size)

                  self.parse_index(data)
                  return self

              def parse_index(self, data):
                  reader = Reader(io.BytesIO(data))
                  mount = reader.fstring()
                  count = reader.i32()

                  if count < 0 or count > 5_000_000:
                      raise PakError("Invalid entry count")

                  for _ in range(count):
                      relative = reader.fstring().replace("\\", "/").lstrip("/")
                      path = (mount + relative).replace("\\", "/")
                      offset = reader.i64()
                      uncompressed = reader.i64()
                      compressed = reader.i64()
                      sha1 = reader.raw(20)

                      blocks = []
                      block_count = reader.i32()
                      if block_count < 0 or block_count > 1_000_000:
                          raise PakError("Corrupted block header")

                      for _b in range(block_count):
                          start = reader.i64()
                          end = reader.i64()
                          blocks.append((start, end))

                      compression_id = reader.u32()
                      compression = {0: "none", 1: "zlib", 2: "gzip", 3: "zstd"}.get(
                          compression_id, "unknown"
                      )

                      self.entries[path] = Entry(
                          path=path,
                          offset=offset,
                          compressed_size=compressed,
                          uncompressed_size=uncompressed,
                          sha1=sha1,
                          compression=compression,
                          blocks=blocks,
                      )

              def read_entry(self, entry):
                  with self.path.open("rb") as fp:
                      if entry.blocks:
                          chunks = []
                          for start, end in entry.blocks:
                              if end < start:
                                  raise PakError("Invalid chunk boundary")
                              fp.seek(start)
                              chunks.append(fp.read(end - start))
                          raw = b"".join(chunks)
                      else:
                          fp.seek(entry.offset)
                          raw = fp.read(entry.compressed_size)

                  if entry.compression == "none":
                      output = raw
                  elif entry.compression == "zlib":
                      try:
                          output = zlib.decompress(raw)
                      except zlib.error as exc:
                          raise PakError(f"Zlib error: {exc}")
                  elif entry.compression == "gzip":
                      output = zlib.decompress(raw, 16 + zlib.MAX_WBITS)
                  else:
                      raise PakError(f"Compression '{entry.compression}' not supported natively")

                  if len(output) != entry.uncompressed_size:
                      raise PakError("Size mismatch during unpacking")

                  return output
          PY

      - name: Generate main.py Application
        shell: bash
        run: |
          cat > main.py <<'PY'
          import os
          import threading
          import time
          from pathlib import Path

          from kivy.app import App
          from kivy.clock import Clock
          from kivy.lang import Builder
          from kivy.properties import StringProperty, ListProperty
          from kivy.uix.screenmanager import ScreenManager, Screen
          from kivy.utils import platform

          from qstool.pak import PakReader, PakError

          KV = r"""
          <DarkCard@BoxLayout>:
              canvas.before:
                  Color:
                      rgba: 0.12, 0.13, 0.17, 1
                  RoundedRectangle:
                      pos: self.pos
                      size: self.size
                      radius: [12, 12, 12, 12]

          <HomeScreen>:
              name: "home"
              canvas.before:
                  Color:
                      rgba: 0.07, 0.08, 0.10, 1
                  Rectangle:
                      pos: self.pos
                      size: self.size

              BoxLayout:
                  orientation: "vertical"
                  padding: [dp(20), dp(32), dp(20), dp(20)]
                  spacing: dp(16)

                  BoxLayout:
                      orientation: "vertical"
                      size_hint_y: None
                      height: dp(75)
                      spacing: dp(2)

                      Label:
                          text: "QsTool Pro"
                          font_size: "30sp"
                          bold: True
                          halign: "left"
                          text_size: self.size
                          color: 0.95, 0.95, 0.98, 1

                      Label:
                          text: "Unreal PAK Archive Manager"
                          font_size: "13sp"
                          halign: "left"
                          text_size: self.size
                          color: 0.55, 0.58, 0.65, 1

                  DarkCard:
                      orientation: "vertical"
                      size_hint_y: None
                      height: dp(120)
                      padding: dp(14)
                      spacing: dp(6)

                      Label:
                          text: "STORAGE DIRECTORY"
                          font_size: "12sp"
                          bold: True
                          color: 0.38, 0.70, 0.98, 1
                          halign: "left"
                          text_size: self.size

                      Label:
                          text: "/storage/emulated/0/QsTool/"
                          font_size: "13sp"
                          bold: True
                          color: 0.88, 0.88, 0.90, 1
                          halign: "left"
                          text_size: self.size

                      Label:
                          text: "Original/ (input) | Unpack/ (output)"
                          font_size: "11sp"
                          color: 0.50, 0.52, 0.58, 1
                          halign: "left"
                          text_size: self.size

                  Widget:

                  Button:
                      text: "OPEN UNPACK CONSOLE"
                      font_size: "14sp"
                      bold: True
                      size_hint_y: None
                      height: dp(52)
                      background_normal: ""
                      background_color: 0.22, 0.47, 0.98, 1
                      on_release:
                          root.manager.current = "unpack"

                  Button:
                      text: "GRANT STORAGE ACCESS"
                      font_size: "13sp"
                      size_hint_y: None
                      height: dp(46)
                      background_normal: ""
                      background_color: 0.16, 0.18, 0.22, 1
                      on_release:
                          app.check_and_request_permissions()


          <UnpackScreen>:
              name: "unpack"
              canvas.before:
                  Color:
                      rgba: 0.07, 0.08, 0.10, 1
                  Rectangle:
                      pos: self.pos
                      size: self.size

              BoxLayout:
                  orientation: "vertical"
                  padding: [dp(16), dp(20), dp(16), dp(16)]
                  spacing: dp(10)

                  BoxLayout:
                      size_hint_y: None
                      height: dp(40)

                      Label:
                          text: "PAK Extractor"
                          font_size: "20sp"
                          bold: True
                          halign: "left"
                          text_size: self.size
                          color: 0.95, 0.95, 0.98, 1

                      Button:
                          text: "Back"
                          size_hint_x: None
                          width: dp(65)
                          background_normal: ""
                          background_color: 0.16, 0.18, 0.22, 1
                          on_release:
                              root.manager.current = "home"

                  Spinner:
                      id: pak_spinner
                      text: "Choose PAK"
                      values: root.pak_values
                      size_hint_y: None
                      height: dp(46)
                      background_normal: ""
                      background_color: 0.13, 0.15, 0.19, 1
                      color: 0.92, 0.92, 0.95, 1

                  BoxLayout:
                      size_hint_y: None
                      height: dp(44)
                      spacing: dp(8)

                      TextInput:
                          id: target
                          text: "ALL"
                          hint_text: "Filename or ALL"
                          multiline: False
                          background_color: 0.13, 0.14, 0.17, 1
                          foreground_color: 1, 1, 1, 1
                          cursor_color: 0.38, 0.70, 0.98, 1
                          padding: [dp(10), dp(10)]

                      Button:
                          text: "Refresh"
                          size_hint_x: 0.35
                          background_normal: ""
                          background_color: 0.16, 0.18, 0.22, 1
                          on_release:
                              root.refresh()

                  Button:
                      text: "EXTRACT"
                      font_size: "14sp"
                      bold: True
                      size_hint_y: None
                      height: dp(48)
                      background_normal: ""
                      background_color: 0.12, 0.65, 0.38, 1
                      on_release:
                          root.start_unpack()

                  Label:
                      text: root.status
                      size_hint_y: None
                      height: dp(24)
                      font_size: "12sp"
                      color: 0.98, 0.76, 0.18, 1
                      halign: "left"
                      text_size: self.size

                  TextInput:
                      text: root.terminal
                      readonly: True
                      font_size: "11sp"
                      background_color: 0.03, 0.04, 0.05, 1
                      foreground_color: 0.35, 0.88, 0.45, 1
                      padding: [dp(8), dp(8)]
          """


          def storage_root():
              if platform == "android":
                  return Path("/storage/emulated/0/QsTool")
              return Path.home() / "QsTool"


          def make_dirs():
              try:
                  root = storage_root()
                  for folder in ("Original", "Editor", "Unpack", "Structure"):
                      (root / folder).mkdir(parents=True, exist_ok=True)
                  return root
              except Exception:
                  return Path.home()


          class HomeScreen(Screen):
              pass


          class UnpackScreen(Screen):
              pak_values = ListProperty([])
              status = StringProperty("Ready")
              terminal = StringProperty("")

              def on_enter(self):
                  make_dirs()
                  self.refresh()

              def log(self, message):
                  def update(_dt):
                      self.terminal += message + "\n"
                  Clock.schedule_once(update)

              def refresh(self):
                  root = storage_root()
                  original = root / "Original"

                  if not original.exists():
                      self.status = "Click GRANT STORAGE ACCESS first"
                      return

                  try:
                      files = sorted(
                          p.name
                          for p in original.iterdir()
                          if p.is_file() and p.suffix.lower() == ".pak"
                      )
                      self.pak_values = files
                      self.ids.pak_spinner.values = files

                      if files:
                          self.ids.pak_spinner.text = files[0]
                          self.status = f"{len(files)} PAK archive(s) ready"
                      else:
                          self.ids.pak_spinner.text = "Choose PAK"
                          self.status = "Copy .pak into QsTool/Original/"
                  except Exception as e:
                      self.status = f"Permission error: {str(e)}"

              def start_unpack(self):
                  pak_name = self.ids.pak_spinner.text.strip()
                  target = self.ids.target.text.strip()

                  if not pak_name or pak_name == "Choose PAK":
                      self.status = "Error: Select a PAK file"
                      return

                  if not target:
                      self.status = "Error: Target cannot be empty"
                      return

                  root = storage_root()
                  pak_path = root / "Original" / pak_name
                  self.terminal = ""
                  self.status = "Extracting..."

                  thread = threading.Thread(
                      target=self.worker,
                      args=(pak_path, root / "Unpack", root / "Structure", target),
                      daemon=True,
                  )
                  thread.start()

              def worker(self, pak_path, unpack_dir, structure_dir, target):
                  started = time.perf_counter()
                  try:
                      self.log(f"Reading: {pak_path.name}")
                      reader = PakReader(pak_path)
                      reader.open()

                      self.log(f"Version: {reader.version} | Entries: {len(reader.entries):,}")

                      if reader.encrypted_index:
                          raise PakError("Index encrypted. AES decryption key required.")

                      wanted = []
                      target_norm = target.replace("\\", "/").strip("/").lower()

                      if target.upper() == "ALL":
                          wanted = list(reader.entries.values())
                      else:
                          for entry in reader.entries.values():
                              if Path(entry.path).name.lower() == target_norm:
                                  wanted.append(entry)

                      if not wanted:
                          raise PakError("Target not found in archive.")

                      self.log(f"Extracting {len(wanted)} items...")
                      total_bytes = 0

                      for idx, entry in enumerate(wanted, 1):
                          clean_subpath = entry.path.lstrip("/\\")
                          output = unpack_dir / clean_subpath
                          output.parent.mkdir(parents=True, exist_ok=True)

                          data = reader.read_entry(entry)
                          output.write_bytes(data)

                          total_bytes += len(data)
                          if idx % 50 == 0 or idx == len(wanted):
                              self.log(f"[{idx}/{len(wanted)}] {clean_subpath} ({len(data):,} B)")

                      report = structure_dir / f"{pak_path.stem}_structure.txt"
                      with report.open("w", encoding="utf-8") as fp:
                          for entry in reader.entries.values():
                              fp.write(f"{entry.path}\t{entry.uncompressed_size}\t{entry.compression}\n")

                      elapsed = time.perf_counter() - started
                      self.log(f"Finished! {total_bytes:,} bytes in {elapsed:.2f}s")
                      Clock.schedule_once(lambda dt: setattr(self, "status", "Completed!"))

                  except Exception as exc:
                      self.log(f"ERROR: {str(exc)}")
                      Clock.schedule_once(lambda dt: setattr(self, "status", "Failed - check log"))


          class QsToolApp(App):
              def build(self):
                  Builder.load_string(KV)
                  sm = ScreenManager()
                  sm.add_widget(HomeScreen(name="home"))
                  sm.add_widget(UnpackScreen(name="unpack"))
                  Clock.schedule_once(lambda dt: self.init_app(), 0.3)
                  return sm

              def init_app(self):
                  self.check_and_request_permissions()
                  make_dirs()

              def check_and_request_permissions(self):
                  if platform != "android":
                      return

                  from android.permissions import request_permissions, Permission
                  request_permissions([
                      Permission.READ_EXTERNAL_STORAGE,
                      Permission.WRITE_EXTERNAL_STORAGE,
                  ])

                  # Handle Android 11+ (API 30+) All Files Access
                  try:
                      from jnius import autoclass
                      Environment = autoclass("android.os.Environment")
                      if not Environment.isExternalStorageManager():
                          Intent = autoclass("android.content.Intent")
                          Settings = autoclass("android.provider.Settings")
                          Uri = autoclass("android.net.Uri")
                          PythonActivity = autoclass("org.kivy.android.PythonActivity")

                          current_activity = PythonActivity.mActivity
                          intent = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION)
                          uri = Uri.parse(f"package:{current_activity.getPackageName()}")
                          intent.setData(uri)
                          current_activity.startActivity(intent)
                  except Exception:
                      pass


          if __name__ == "__main__":
              QsToolApp().run()
          PY

      - name: Generate buildozer.spec
        shell: bash
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = QsTool
          package.name = qstool
          package.domain = org.qstool

          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,csv,txt
          source.include_patterns = assets/*,qstool/*
          source.exclude_dirs = .git,.buildozer,bin,build,dist,__pycache__

          version = 1.0.0
          requirements = python3,kivy,android

          orientation = portrait
          fullscreen = 0

          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.archs = arm64-v8a

          android.accept_sdk_license = True
          android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE

          p4a.bootstrap = sdl2
          p4a.branch = master

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build Android APK
        shell: bash
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QsTool-Clean-APK
          path: bin/*.apk
          if-no-files-found: error
